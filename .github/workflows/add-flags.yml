name: Auto Add Country Flags

on:
  workflow_dispatch:          # 允许手动触发
  schedule:
    - cron: '0 */12 * * *'   # 每12小时自动跑一次（可改）

jobs:
  add-flags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run add flags script
        run: python add_flags.py

      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ipv6.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: add country flags to ipv6.txt" && git push)
