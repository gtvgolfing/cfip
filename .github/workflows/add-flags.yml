name: Auto Add Country Flags

on:
  workflow_dispatch:          # 手动触发
  schedule:
    - cron: '0 */12 * * *'   # 每12小时自动跑一次

permissions:
  contents: write             # 允许推送代码

jobs:
  add-flags:
    runs-on: ubuntu-latest

    steps:
      # 检出仓库
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 安装依赖
      - name: Install dependencies
        run: pip install requests

      # 运行脚本，处理 ipv6.txt 和 ip.txt
      - name: Run add flags script
        run: python add_flags.py

      # 同时提交 IPv4 和 IPv6 文件
      - name: Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add ipv6.txt ip.txt

          if git diff --staged --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "auto: update country flags for IPv4 and IPv6"
            git push
          fi
